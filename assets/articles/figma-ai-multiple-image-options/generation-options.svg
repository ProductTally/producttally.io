    <linearGradient id="tile3" x2="1" y2="1"><stop stop-color="#f3bd79"/><stop offset="1" stop-color="#ee8a70"/></linearGradient>
    <linearGradient id="tile4" x2="1" y2="1"><stop stop-color="#b9a7ee"/><stop offset="1" stop-color="#8ad4d0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#472d3e" flood-opacity=".12"/></filter>
