<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Figma AI image generation choices</title>
  <desc id="desc">An editorial diagram comparing multiple options from one model with one result from each of up to three models.</desc>
